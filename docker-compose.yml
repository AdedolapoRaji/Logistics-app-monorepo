version: '3.8'

services:
  order-service:
    image: adedolapo05/order-service:${BUILD_NUM:-latest}
    container_name: order-service
    ports:
      - "5001:5001"
    restart: always

  driver-service:
    image: adedolapo05/driver-service:${BUILD_NUM:-latest}
    container_name: driver-service
    ports:
      - "5002:5002"
    restart: always

  tracking-service:
    image: adedolapo05/tracking-service:${BUILD_NUM:-latest}
    container_name: tracking-service
    ports:
      - "5003:5003"
    restart: always

  notification-service:
    image: adedolapo05/notification-service:${BUILD_NUM:-latest}
    container_name: notification-service
    ports:
      - "5004:5004"
    restart: always
